/* =========================================================

async function processSOAFile(file) {

        );

            file.name.toLowerCase().endsWith(".pdf")

            file.type.startsWith(

                    file,
                    1,

                );

        }

/* =========================================================
   PDF → IMAGE → OCR
========================================================= */

async function processPDF(file) {

    const arrayBuffer =
        await file.arrayBuffer();


    const pdf =
        await pdfjsLib
            .getDocument({
                data:
                    arrayBuffer
            })
            .promise;


    let combinedText =
        "";


    for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ) {

        document
            .getElementById(
                "ocrText"
            )
            .textContent =

                "Rendering PDF page " +
                pageNumber +
                " of " +
                pdf.numPages +
                "...";


        const page =
            await pdf.getPage(
                pageNumber
            );


        const viewport =
            page.getViewport({
                scale:
                    2.4
            });


        const canvas =
            document.createElement(
                "canvas"
            );


        const context =
            canvas.getContext(
                "2d"
            );


        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        const text =
            await runOCR(
                canvas,
                pageNumber,
                pdf.numPages
            );


        combinedText +=

            "\n" +
            text +
            "\n";

    }


    return combinedText;
}


/* =========================================================
   OCR
========================================================= */

async function runOCR(
    source,
    page,
    totalPages
) {

    const progress =
        document.getElementById(
            "ocrProgressBar"
        );


    const result =
        await Tesseract.recognize(

            source,

            "eng",

            {

                logger:
                    message => {

                        if (
                            message.status ===
                            "recognizing text"
                        ) {

                            const pageProgress =
                                message.progress;


                            const overall =
                                (
                                    (page - 1) +
                                    pageProgress
                                )
                                /
                                totalPages;


                            progress.style.width =

                                Math.round(
                                    overall * 100
                                )
                                +
                                "%";


                            document
                                .getElementById(
                                    "ocrText"
                                )
                                .textContent =

                                    "Reading page " +
                                    page +
                                    " of " +
                                    totalPages +
                                    " — " +
                                    Math.round(
                                        pageProgress *
                                        100
                                    ) +
                                    "%";

                        }

                    }

            }

        );


    return result.data.text;
}


/* =========================================================
   PARSE SOA OCR TEXT
========================================================= */

function parseSOA(text) {

    const cleanText =
        text
            .replace(/\r/g, "\n")
            .replace(/[ \t]+/g, " ")
            .replace(/\n+/g, "\n");


    const flatText =
        cleanText
            .replace(/\n/g, " ")
            .replace(/\s+/g, " ");


    const accountName =
        extractAccountName(
            flatText
        );


    const checks =
        extractCheckRows(
            flatText
        );


    return {

        accountName:
            accountName,

        checks:
            checks

    };
}


/* =========================================================
   ACCOUNT NAME
========================================================= */

function extractAccountName(text) {

    const patterns = [

        /Name\s*:\s*(.+?)\s+Page\s*#/i,

        /Name\s*:\s*(.+?)\s+Loan\s*Amount/i,

        /Name\s+(.+?)\s+Page\s*#/i,

        /Name\s+(.+?)\s+Loan\s*Amount/i

    ];


    for (const pattern of patterns) {

        const match =
            text.match(pattern);


        if (
            match &&
            match[1]
        ) {

            return match[1]
                .replace(/\s+/g, " ")
                .replace(/PAGE\s*#.*$/i, "")
                .trim()
                .toUpperCase();

        }

    }


    return "";
}


/* =========================================================
   CHECK ROW EXTRACTION
========================================================= */

function extractCheckRows(text) {

    const checks = [];

    /*
    Supports SOA rows such as:

    11/05/2026 35,291.67 RCBC-IMUS 0009000501 7-591-59891-0

    and:

    11/19/2026 50,416.67 BDO-MAGALLANES VILLAGE 12 002020218840
    */

    const rowRegex =
        /(\d{2}[\/\-]\d{2}[\/\-]\d{4})\s+([\d,]+\.\d{2})\s+(.+?)\s+(\d{1,16})\s+([0-9][0-9\-\s]{5,25})(?=\s+\d{2}[\/\-]\d{2}[\/\-]\d{4}|\s+Total|\s+TOTAL|\s+LOAN|\s*$)/g;

    let match;

    while (
        (
            match =
                rowRegex.exec(text)
        ) !== null
    ) {

        const rawDate =
            match[1];

        const rawAmount =
            match[2];

        const rawBankBranch =
            match[3]
                .trim();

        const checkNo =
            match[4]
                .trim();

        const accountNo =
            match[5]
                .trim();

        const bankInfo =
            parseBankAndBranch(
                rawBankBranch
            );

        checks.push({

            bank:
                bankInfo.bank,

            branch:
                bankInfo.branch,

            check_date:
                convertDateToISO(
                    rawDate
                ),

            check_amount:
                parseMoney(
                    rawAmount
                ),

            check_no:
                checkNo,

            account_no:
                accountNo,

            fund_source:
                document
                    .getElementById(
                        "defaultFundSource"
                    )
                    .value

        });

    }

    console.log(
        "CHECK ROWS DETECTED:",
        checks
    );

    return checks;
}


/* =========================================================
   BANK / BRANCH PARSER
========================================================= */

function parseBankAndBranch(rawText) {

    let text =
        String(rawText)

            .replace(
                /\s+/g,
                " "
            )

            .trim()

            .toUpperCase();

    text =
        text.replace(
            /^[\s\-–—:]+|[\s\-–—:]+$/g,
            ""
        );


    /*
    RCBC
    */

    if (
        /^RCBC[\s\-–—]/i.test(text)
    ) {

        return {

            bank:
                "RCBC",

            branch:
                text
                    .replace(
                        /^RCBC[\s\-–—]*/i,
                        ""
                    )
                    .trim()

        };

    }


    /*
    BDO
    */

    if (
        /^BDO[\s\-–—]/i.test(text)
    ) {

        return {

            bank:
                "BDO",

            branch:
                text
                    .replace(
                        /^BDO[\s\-–—]*/i,
                        ""
                    )
                    .trim()

        };

    }


    /*
    METROBANK
    */

    if (
        /^METROBANK/i.test(text)
    ) {

        return {

            bank:
                "MB",

            branch:
                text
                    .replace(
                        /^METROBANK[\s\-–—]*/i,
                        ""
                    )
                    .trim()

        };

    }


    /*
    BPI
    */

    if (
        /^BPI[\s\-–—]/i.test(text)
    ) {

        return {

            bank:
                "BPI",

            branch:
                text
                    .replace(
                        /^BPI[\s\-–—]*/i,
                        ""
                    )
                    .trim()

        };

    }


    /*
    UNIONBANK
    */

    if (
        /^UNION\s*BANK/i.test(text) ||
        /^UNIONBANK/i.test(text)
    ) {

        return {

            bank:
                "UB",

            branch:
                text
                    .replace(
                        /^UNION\s*BANK[\s\-–—]*/i,
                        ""
                    )
                    .replace(
                        /^UNIONBANK[\s\-–—]*/i,
                        ""
                    )
                    .trim()

        };

    }


    /*
    Generic bank matching
    */

    const sortedBanks =
        [...BANKS]
            .sort(
                (a, b) =>
                    b.length -
                    a.length
            );

    for (
        const bank of sortedBanks
    ) {

        const normalizedBank =
            bank.toUpperCase();

        if (
            text.startsWith(
                normalizedBank
            )
        ) {

            return {

                bank:
                    bank,

                branch:
                    text
                        .substring(
                            normalizedBank.length
                        )
                        .replace(
                            /^[\s\-–—]+/,
                            ""
                        )
                        .trim()

            };

        }

    }


    return {

        bank:
            "",

        branch:
            text

    };
}


/* =========================================================
   BRANCH CLEANER
========================================================= */

function cleanBranch(
    text,
    bank
) {

    return text

        .replace(
            bank,
            ""
        )

        .replace(
            /^[\s\-–—]+/,
            ""
        )

        .trim();
}


/* =========================================================
   MONEY
========================================================= */

function parseMoney(value) {

    return Number(

        String(value)
            .replace(
                /,/g,
                ""
            )
            .replace(
                /[^\d.]/g,
                ""
            )

    ) || 0;
}


/* =========================================================
   DATE → YYYY-MM-DD
========================================================= */

function convertDateToISO(value) {

    const cleaned =
        value.replace(
            /-/g,
            "/"
        );


    const parts =
        cleaned.split(
            "/"
        );


    if (
        parts.length !== 3
    ) {

        return "";

    }


    const month =
        parts[0]
            .padStart(
                2,
                "0"
            );

    const day =
        parts[1]
            .padStart(
                2,
                "0"
            );

    const year =
        parts[2];


    return (

        year +
        "-" +
        month +
        "-" +
        day

    );
}

/* =========================================================
   ADD CHECK

   If called manually:
   copies Bank, Branch, Amount and Fund Source from Check 1.

   If called from OCR:
   uses the provided prefill object.
========================================================= */

function addCheck(
    prefill = null
) {

    checkCounter++;


    let values = {

        bank:
            "",

        branch:
            "",

        check_date:
            "",

        check_amount:
            "",

        check_no:
            "",

        fund_source:
            ""

    };


    /*
    OCR / imported values
    */

    if (
        prefill &&
        typeof prefill ===
        "object"
    ) {

        values = {

            ...values,
            ...prefill

        };

    }

    else {

        /*
        Manual Add Another Check:
        copy Check 1 values.
        */

        const firstCard =
            document.querySelector(
                ".check-card"
            );


        if (
            firstCard
        ) {

            values.bank =
                firstCard
                    .querySelector(
                        ".bank"
                    )
                    .value;


            values.branch =
                firstCard
                    .querySelector(
                        ".branch"
                    )
                    .value;


            values.check_amount =
                firstCard
                    .querySelector(
                        ".check-amount"
                    )
                    .value;


            values.fund_source =
                firstCard
                    .querySelector(
                        ".fund-source"
                    )
                    .value;

        }

        else {

            values.fund_source =
                document
                    .getElementById(
                        "defaultFundSource"
                    )
                    .value;

        }

    }


    const container =
        document.getElementById(
            "checksContainer"
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "check-card";


    card.innerHTML = `

        <div class="check-header">

            <div class="check-title">
                Check
            </div>

            <button
                type="button"
                class="remove-btn"
                onclick="removeCheck(this)"
            >
                Remove
            </button>

        </div>


        <div class="check-content">

            <div class="check-grid">


                <div class="form-group">

                    <label>
                        Bank
                        <span class="required">
                            (required)
                        </span>
                    </label>

                    <select class="bank">

                        ${getBankOptions()}

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Branch
                        <span class="required">
                            (required)
                        </span>
                    </label>

                    <input
                        type="text"
                        class="branch"
                        value="${escapeAttribute(values.branch)}"
                        placeholder="E.G BGC"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Check Date
                        <span class="required">
                            (required)
                        </span>
                    </label>

                    <input
                        type="date"
                        class="check-date"
                        value="${escapeAttribute(values.check_date)}"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Check Amount
                        <span class="required">
                            (required)
                        </span>
                    </label>

                    <input
                        type="number"
                        class="check-amount"
                        min="0.01"
                        step="0.01"
                        value="${escapeAttribute(values.check_amount)}"
                        oninput="updateSummary()"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Check No.
                        <span class="required">
                            (required)
                        </span>
                    </label>

                    <input
                        type="text"
                        class="check-no"
                        value="${escapeAttribute(values.check_no)}"
                        placeholder="Enter Check Number"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Fund Source
                        <span class="required">
                            (required)
                        </span>
                    </label>

                    <select class="fund-source">

                        ${getFundSourceOptions()}

                    </select>

                </div>


            </div>

        </div>

    `;


    container.appendChild(
        card
    );


    card
        .querySelector(
            ".bank"
        )
        .value =
            values.bank || "";


    card
        .querySelector(
            ".fund-source"
        )
        .value =
            values.fund_source ||
            document
                .getElementById(
                    "defaultFundSource"
                )
                .value ||
            "";


    renumberChecks();

    updateSummary();
}

/* =========================================================
   REMOVE CHECK
========================================================= */

function removeCheck(button) {

    const cards =
        document.querySelectorAll(
            ".check-card"
        );


    if (
        cards.length <= 1
    ) {

        alert(
            "At least one check is required."
        );

        return;
    }


    button
        .closest(
            ".check-card"
        )
        .remove();


    renumberChecks();

    updateSummary();
}


/* =========================================================
   RENUMBER
========================================================= */

function renumberChecks() {

    const cards =
        document.querySelectorAll(
            ".check-card"
        );


    cards.forEach(
        (card,index) => {

            card
                .querySelector(
                    ".check-title"
                )
                .textContent =

                    "Check " +
                    (index + 1);

        }
    );


    document
        .getElementById(
            "checkCounterText"
        )
        .textContent =

            cards.length +
            " Check(s)";
}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {

    const cards =
        document.querySelectorAll(
            ".check-card"
        );


    let total =
        0;


    cards.forEach(
        card => {

            total +=

                Number(

                    card
                        .querySelector(
                            ".check-amount"
                        )
                        .value

                ) || 0;

        }
    );


    document
        .getElementById(
            "totalChecks"
        )
        .textContent =
            cards.length;


    document
        .getElementById(
            "checkCounterText"
        )
        .textContent =

            cards.length +
            " Check(s)";


    document
        .getElementById(
            "totalAmount"
        )
        .textContent =

            total.toLocaleString(
                "en-PH",
                {
                    style:
                        "currency",

                    currency:
                        "PHP"
                }
            );
}


/* =========================================================
   VALIDATE
========================================================= */

function validateForm() {

    const accountName =
        document
            .getElementById(
                "accountName"
            )
            .value
            .trim();


    if (
        !accountName
    ) {

        alert(
            "Please enter the Account Name."
        );

        return false;
    }


    const cards =
        document.querySelectorAll(
            ".check-card"
        );


    const duplicates =
        new Set();


    for (
        let i = 0;
        i < cards.length;
        i++
    ) {

        const card =
            cards[i];


        const bank =
            card
                .querySelector(
                    ".bank"
                )
                .value;


        const branch =
            card
                .querySelector(
                    ".branch"
                )
                .value
                .trim();


        const date =
            card
                .querySelector(
                    ".check-date"
                )
                .value;


        const amount =
            card
                .querySelector(
                    ".check-amount"
                )
                .value;


        const checkNo =
            card
                .querySelector(
                    ".check-no"
                )
                .value
                .trim();


        const fundSource =
            card
                .querySelector(
                    ".fund-source"
                )
                .value;


        if (
            !bank ||
            !branch ||
            !date ||
            !amount ||
            !checkNo ||
            !fundSource
        ) {

            alert(

                "Please complete all fields for Check " +
                (i + 1) +
                "."

            );

            return false;
        }


        const key =

            bank
                .toUpperCase()

            +
            "|"

            +
            checkNo
                .toUpperCase();


        if (
            duplicates.has(
                key
            )
        ) {

            alert(

                "Duplicate check: " +
                bank +
                " / " +
                checkNo

            );

            return false;
        }


        duplicates.add(
            key
        );

    }


    return true;
}


/* =========================================================
   GET CHECKS
========================================================= */

function getChecks() {

    return [

        ...document.querySelectorAll(
            ".check-card"
        )

    ].map(
        card => ({

            bank:
                card
                    .querySelector(
                        ".bank"
                    )
                    .value,

            branch:
                card
                    .querySelector(
                        ".branch"
                    )
                    .value
                    .trim(),

            check_date:
                card
                    .querySelector(
                        ".check-date"
                    )
                    .value,

            check_amount:
                Number(
                    card
                        .querySelector(
                            ".check-amount"
                        )
                        .value
                ),

            check_no:
                card
                    .querySelector(
                        ".check-no"
                    )
                    .value
                    .trim(),

            fund_source:
                card
                    .querySelector(
                        ".fund-source"
                    )
                    .value

        })
    );
}


/* =========================================================
   CREATE MONDAY ITEM
========================================================= */

async function createMondayItem(
    accountName,
    check
) {

    const targetGroup =
        FUND_SOURCE_GROUPS[
            check.fund_source
        ];


    if (
        !targetGroup
    ) {

        throw new Error(

            "No group mapping for " +
            check.fund_source

        );
    }


    const mondayBankLabel =

        BANK_LABEL_MAP[
            check.bank
        ]

        ||

        check.bank;


    const columnValues = {};


    columnValues[
        COLUMN_IDS.BANK
    ] = {

        label:
            mondayBankLabel

    };


    columnValues[
        COLUMN_IDS.BRANCH
    ] =
        check.branch;


    columnValues[
        COLUMN_IDS.CHECK_DATE
    ] = {

        date:
            check.check_date

    };


    columnValues[
        COLUMN_IDS.CHECK_AMOUNT
    ] =
        check.check_amount;


    columnValues[
        COLUMN_IDS.CHECK_NO
    ] =
        check.check_no;


    columnValues[
        COLUMN_IDS.FUND_SOURCE
    ] = {

        label:
            check.fund_source

    };


    const query = `

        mutation CreateCheck(
            $boardId: ID!,
            $groupId: String!,
            $itemName: String!,
            $columnValues: JSON!
        ) {

            create_item(
                board_id: $boardId,
                group_id: $groupId,
                item_name: $itemName,
                column_values: $columnValues
            ) {

                id
                name

            }

        }

    `;


    const variables = {

        boardId:
            BOARD_ID,

        groupId:
            targetGroup,

        itemName:
            accountName,

        columnValues:
            JSON.stringify(
                columnValues
            )

    };


    const response =
        await fetch(
            MONDAY_API,
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        MONDAY_TOKEN,

                    "API-Version":
                        "2026-07"

                },

                body:
                    JSON.stringify({

                        query:
                            query,

                        variables:
                            variables

                    })

            }
        );


    const result =
        await response.json();


    if (
        result.errors &&
        result.errors.length
    ) {

        throw new Error(

            result.errors
                .map(
                    error =>
                        error.message
                )
                .join(
                    " | "
                )

        );
    }


    return result
        .data
        .create_item;
}


/* =========================================================
   SUBMIT ALL
========================================================= */

async function submitAllChecks() {

    if (
        !validateForm()
    ) {

        return;
    }


    const accountName =
        document
            .getElementById(
                "accountName"
            )
            .value
            .trim();


    const checks =
        getChecks();


    const submit =
        document.getElementById(
            "submitButton"
        );


    const progressArea =
        document.getElementById(
            "progressArea"
        );


    const progress =
        document.getElementById(
            "progressBar"
        );


    const progressText =
        document.getElementById(
            "progressText"
        );


    const resultBox =
        document.getElementById(
            "resultBox"
        );


    submit.disabled =
        true;


    submit.textContent =
        "CREATING CHECKS...";


    progressArea.style.display =
        "block";


    progress.style.width =
        "0%";


    resultBox.style.display =
        "none";


    let successful =
        0;


    const failed =
        [];


    for (
        let i = 0;
        i < checks.length;
        i++
    ) {

        const check =
            checks[i];


        progressText.textContent =

            "Creating Check " +
            (i + 1) +
            " of " +
            checks.length +
            " — " +
            check.check_no;


        try {

            await createMondayItem(
                accountName,
                check
            );


            successful++;

        }

        catch (error) {

            failed.push({

                check_no:
                    check.check_no,

                error:
                    error.message

            });

        }


        progress.style.width =

            Math.round(

                (
                    (i + 1) /
                    checks.length
                )

                * 100

            )
            +
            "%";

    }


    resultBox.style.display =
        "block";


    if (
        failed.length === 0
    ) {

        resultBox.className =
            "success";


        resultBox.innerHTML = `

            <strong>
                All Checks Created Successfully
            </strong>

            <br><br>

            Account:
            ${escapeHTML(accountName)}

            <br>

            Checks Created:
            ${successful}

        `;

    }

    else {

        resultBox.className =
            "error";


        let html =
            "";


        failed.forEach(
            item => {

                html += `

                    <div>
                        ${escapeHTML(
                            item.check_no
                        )}
                        —
                        ${escapeHTML(
                            item.error
                        )}
                    </div>

                `;

            }
        );


        resultBox.innerHTML = `

            <strong>
                Batch Completed With Errors
            </strong>

            <br><br>

            Successful:
            ${successful}

            <br>

            Failed:
            ${failed.length}

            <br><br>

            ${html}

        `;

    }


    progressText.textContent =
        "Finished.";


    submit.disabled =
        false;


    submit.textContent =
        "CREATE CHECKS IN MONDAY";
}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


function escapeAttribute(value) {

    return escapeHTML(
        value
    );
}
